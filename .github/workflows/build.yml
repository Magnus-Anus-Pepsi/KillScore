name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create libs directory
      run: mkdir -p libs

    - name: Download TACZ
      run: |
        cd libs
        curl -L -o tacz-1.1.8_mapped_official_1.20.1.jar "https://github.com/Timeless-and-Classics-Zero/Timeless-and-Classics-Zero/releases/download/v1.1.8/Timeless-and-Classics-Zero-1.20.1-1.1.8.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: build/libs/*.jar
